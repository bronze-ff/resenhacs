name: R2 replays

# Manual. Não roda no schedule nem em PR: inventario-r2 só lista o bucket;
# comprimir-replays regrava replays/ na MESMA chave (gzip). Nenhum dos dois apaga
# objeto. Dry-run é o padrão — desmarque pra gravar.
# O PUT manda If-Match com o ETag do HEAD: se o Coletor regravar a mesma chave
# no meio, o R2 responde 412 e o replay novo fica. Este group só impede dois
# backfills ao mesmo tempo — não entra na fila `coletor` (o backfill pode levar horas).
on:
  workflow_dispatch:
    inputs:
      acao:
        description: 'inventario-r2 (só leitura) ou comprimir-replays (backfill gzip)'
        type: choice
        options:
          - inventario-r2
          - comprimir-replays
        default: inventario-r2
      dry_run:
        description: 'comprimir-replays: simular sem gravar. Desmarque só pra aplicar.'
        type: boolean
        default: true
      limit:
        description: 'comprimir-replays: máximo de objetos a comprimir nesta run (vazio = todos os pendentes; os já gzip não contam)'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: r2-replays
  cancel-in-progress: false

jobs:
  r2:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: producao
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: coletor/requirements.txt
      - name: Instalar dependências do Coletor
        working-directory: coletor
        run: pip install -r requirements.txt
      - name: Inventário ou backfill gzip
        working-directory: coletor
        env:
          PYTHONPATH: src
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ACAO: ${{ inputs.acao }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
          LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          echo "acao=${ACAO} dry_run=${DRY_RUN} limit=${LIMIT:-<sem limite>}"
          if [ "$ACAO" = "inventario-r2" ]; then
            python -m coletor.main inventario-r2
          elif [ "$ACAO" = "comprimir-replays" ]; then
            args=(comprimir-replays)
            # Qualquer coisa que não seja exatamente "false" fica em dry-run.
            if [ "$DRY_RUN" = "false" ]; then
              args+=(--no-dry-run)
            else
              args+=(--dry-run)
            fi
            if [ -n "$LIMIT" ]; then
              if ! [[ "$LIMIT" =~ ^[0-9]+$ ]]; then
                echo "::error::limit inválido (esperado inteiro >= 0)"
                exit 1
              fi
              args+=(--limit "$LIMIT")
            fi
            python -m coletor.main "${args[@]}"
          else
            echo "::error::acao inválida: '$ACAO'"
            exit 1
          fi
