name: Site

# CI do site (client + server) — até 2026-08-05 NÃO existia: o único workflow era o do
# Coletor (que roda só pytest), então as ~58 suítes de vitest do site nunca rodavam em
# PR, e o Dependabot mergeava bumps de site/* sem teste nenhum. Este workflow fecha
# esse buraco. Roda em PR e em push na main, filtrado por path pra não gastar minuto
# à toa em mudança que só toca coletor/bot/docs.
on:
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']

# Escopo mínimo do GITHUB_TOKEN — só checkout, mesma razão do coletor.yml.
permissions:
  contents: read

# PR atualizada cancela a run anterior da mesma PR (diferente do coletor, que serializa
# sem cancelar — lá o motivo é a sessão única do bot; aqui é só não desperdiçar minuto).
concurrency:
  group: site-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Dois jobs (não um): client e server têm node_modules e caches independentes e
  # rodam em paralelo — o tempo total da PR vira o do mais lento, não a soma.
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site/server
    steps:
      # Actions pinadas por SHA (não por tag mutável) — mesma regra do coletor.yml.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/server/package-lock.json
      - run: npm ci
      - run: npm test

  client:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: site/client
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/client/package-lock.json
      - run: npm ci
      - run: npm test
