# Atualização mensal e agrupada. Cada PR gasta CI e cota de review; security
# updates (Settings → Code security) continuam imediatos, fora deste calendário.
version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/site/server'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-e-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'npm'
    directory: '/site/client'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-e-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'npm'
    directory: '/bot'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-e-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'pip'
    directory: '/coletor'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      minor-e-patch:
        update-types: ['minor', 'patch']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      actions:
        patterns: ['*']
